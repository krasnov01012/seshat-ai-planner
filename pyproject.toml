[project]
name = "seshat"
version = "0.1.0"
description = "Telegram-планер и персональный диспетчер"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.15",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dateutil>=2.9",
    "httpx>=0.28",
    "tzdata>=2024.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "time-machine>=2.16",
    "ruff>=0.8",
    "pytest-timeout>=2.4.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seshat"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "DTZ",  # flake8-datetimez — запрещает наивный datetime
    "RUF",
]
ignore = [
    # RUF001-003 считают кириллицу «неоднозначными» символами, потому что часть
    # букв похожа на латинские. Комментарии и docstring в проекте русские
    # по правилам AGENTS.md, поэтому правило даёт только ложные срабатывания.
    "RUF001",
    "RUF002",
    "RUF003",
]

# DTZ включён намеренно и снимать его нельзя: наивный datetime в этом проекте —
# источник ровно того класса багов, ради которого написан ARCHITECTURE.md.
# См. AGENTS.md, раздел «Правила по коду».

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ"]
# Промпты в скриптах замеров — данные, а не код. Переносы внутри них изменили бы
# текст запроса к модели, и прогоны перестали бы быть сравнимыми между собой.
"tools/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Цикл событий — функциональный (умолчание). Session-scoped async-фикстуры
# в паре с asyncpg дают зависание в teardown; подробности — в tests/conftest.py.
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Страховка от повторения того же зависания: тест не может висеть вечно.
timeout = 60
